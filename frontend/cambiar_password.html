<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cambiar contraseña · Triage asistido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div class="wrap">
  <section class="app" style="max-width:560px;margin:40px auto">
    <div class="app-head">
      <div class="brand"><img class="logo" src="img/logo-hrrg.png" alt="HRRG · Hospital Regional Río Grande"></div>
      <div class="chips"><span class="chip">Servidor local</span></div>
    </div>
    <div class="body">
      <form class="login" id="pwForm" novalidate>
        <h3>Cambiar contraseña</h3>
        <div class="hint" id="motivo">Antes de continuar tenés que elegir una contraseña nueva.</div>
        <div class="banner" id="pwErr" hidden role="alert"><b></b></div>
        <label>Contraseña actual o clave temporal<input id="pwActual" type="password" autocomplete="current-password"></label>
        <label>Contraseña nueva<input id="pwNueva" type="password" autocomplete="new-password"></label>
        <label>Repetir contraseña nueva<input id="pwRepetir" type="password" autocomplete="new-password"></label>
        <div class="hint">Mínimo 12 caracteres, con mayúscula, minúscula, número y símbolo. No puede ser una de tus últimas 5.</div>
        <button type="submit" class="btn primary">Guardar contraseña</button>
        <button type="button" class="linkbtn" id="salir" style="align-self:flex-start">Salir sin cambiar</button>
      </form>
    </div>
  </section>
</div>
<script src="api.js"></script>
<script src="js/mostrar_clave.js"></script>
<script src="js/cambiar_password.js"></script>
</body>
</html>
