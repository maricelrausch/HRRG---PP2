<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">IngenIA Salud – Triage</title>
  <desc id="d">Ilustración de la entrada de la guardia del hospital con una pantalla de triage asistido por IA local.</desc>
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DDEBF5"/>
      <stop offset="1" stop-color="#F4F8FB"/>
    </linearGradient>
    <linearGradient id="vidrio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9D3E6"/>
      <stop offset="1" stop-color="#8FB4CF"/>
    </linearGradient>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F2A33" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="420" fill="url(#cielo)"/>
  <!-- Montañas de Tierra del Fuego -->
  <path d="M0 250 L110 170 L200 225 L330 120 L450 215 L590 120 L700 200 L800 140 L900 210 L1010 110 L1120 200 L1200 160 L1200 300 L0 300 Z" fill="#C9DCE8"/>
  <path d="M590 120 L626 146 L608 149 L590 138 L574 150 L556 145 Z M1010 110 L1046 136 L1028 139 L1010 128 L994 140 L976 135 Z M1200 160 L1182 173 L1200 171 Z" fill="#FFFFFF"/>
  <!-- Suelo -->
  <rect y="330" width="1200" height="90" fill="#E3E9EE"/>
  <rect y="330" width="1200" height="6" fill="#CAD4DC"/>

  <!-- Edificio de la guardia -->
  <g>
    <rect x="70" y="120" width="490" height="212" fill="#FDFDFB" stroke="#CAD4DC" stroke-width="2"/>
    <rect x="70" y="110" width="490" height="20" fill="#0F4C6E"/>
    <!-- Ventanas -->
    <g fill="url(#vidrio)">
      <rect x="100" y="150" width="70" height="46" rx="3"/>
      <rect x="190" y="150" width="70" height="46" rx="3"/>
      <rect x="440" y="150" width="70" height="46" rx="3"/>
      <rect x="100" y="216" width="70" height="46" rx="3"/>
      <rect x="440" y="216" width="70" height="46" rx="3"/>
    </g>
    <!-- Cartel GUARDIA -->
    <rect x="270" y="142" width="160" height="40" rx="6" fill="#C62828"/>
    <text x="350" y="169" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="3">GUARDIA</text>
    <!-- Cruz -->
    <rect x="337" y="96" width="26" height="8" rx="2" fill="#C62828"/>
    <rect x="346" y="87" width="8" height="26" rx="2" fill="#C62828"/>
    <!-- Puerta automática -->
    <rect x="285" y="214" width="130" height="118" fill="#0F2A33"/>
    <rect x="291" y="220" width="57" height="112" fill="url(#vidrio)"/>
    <rect x="352" y="220" width="57" height="112" fill="url(#vidrio)"/>
    <!-- Alero -->
    <path d="M250 206 H450 L462 214 H238 Z" fill="#0F4C6E"/>
    <!-- Franja de colores del triage -->
    <g>
      <rect x="190" y="290" width="18" height="42" fill="#C62828"/>
      <rect x="208" y="290" width="18" height="42" fill="#EF6C00"/>
      <rect x="226" y="290" width="18" height="42" fill="#F9A825"/>
      <rect x="244" y="290" width="18" height="42" fill="#2E7D32"/>
      <rect x="262" y="290" width="18" height="42" fill="#1565C0"/>
    </g>
  </g>

  <!-- Ambulancia -->
  <g transform="translate(570 280) scale(0.82)">
    <rect x="0" y="10" width="120" height="48" rx="6" fill="#FFFFFF" stroke="#9AA9B5" stroke-width="2"/>
    <path d="M120 22 H146 L162 40 V58 H120 Z" fill="#FFFFFF" stroke="#9AA9B5" stroke-width="2"/>
    <path d="M126 27 H143 L154 40 H126 Z" fill="url(#vidrio)"/>
    <rect x="0" y="34" width="162" height="6" fill="#C62828"/>
    <rect x="48" y="16" width="20" height="6" fill="#C62828"/>
    <rect x="55" y="9" width="6" height="20" fill="#C62828"/>
    <rect x="40" y="2" width="14" height="8" rx="2" fill="#1565C0"/>
    <circle cx="32" cy="60" r="11" fill="#2B3A44"/><circle cx="32" cy="60" r="4" fill="#CAD4DC"/>
    <circle cx="134" cy="60" r="11" fill="#2B3A44"/><circle cx="134" cy="60" r="4" fill="#CAD4DC"/>
  </g>

  <g transform="translate(22 0)">
  <!-- Pantalla de triage asistido -->
  <g filter="url(#sombra)">
    <rect x="700" y="62" width="430" height="270" rx="14" fill="#FFFFFF"/>
  </g>
  <rect x="700" y="62" width="430" height="44" rx="14" fill="#0F2A33"/>
  <rect x="700" y="92" width="430" height="14" fill="#0F2A33"/>
  <circle cx="724" cy="84" r="5" fill="#F9A825"/>
  <text x="740" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">IngenIA Salud – Triage</text>
  <rect x="1022" y="72" width="94" height="24" rx="12" fill="#2E7D32"/>
  <text x="1069" y="89" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">IA local</text>

  <!-- Relato dictado -->
  <rect x="722" y="124" width="182" height="96" rx="8" fill="#F1F5F8"/>
  <circle cx="742" cy="144" r="11" fill="#0F4C6E"/>
  <rect x="739" y="136" width="6" height="10" rx="3" fill="#FFFFFF"/>
  <path d="M736 143 a6 6 0 0 0 12 0" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
  <rect x="741.2" y="149" width="1.6" height="4" fill="#FFFFFF"/>
  <rect x="760" y="140" width="120" height="7" rx="3.5" fill="#B7C5D0"/>
  <rect x="736" y="164" width="150" height="7" rx="3.5" fill="#CAD4DC"/>
  <rect x="736" y="180" width="130" height="7" rx="3.5" fill="#CAD4DC"/>
  <rect x="736" y="196" width="142" height="7" rx="3.5" fill="#CAD4DC"/>

  <!-- Signos vitales -->
  <rect x="722" y="232" width="182" height="80" rx="8" fill="#F1F5F8"/>
  <polyline points="736,276 760,276 768,256 778,298 788,266 796,276 890,276" fill="none" stroke="#C62828" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Tarjeta de sugerencia -->
  <rect x="920" y="124" width="188" height="188" rx="10" fill="#FFFFFF" stroke="#CAD4DC" stroke-width="2"/>
  <rect x="920" y="124" width="188" height="66" rx="10" fill="#F9A825"/>
  <rect x="920" y="170" width="188" height="20" fill="#F9A825"/>
  <text x="1014" y="164" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1A1D26">AMARILLO</text>
  <rect x="936" y="206" width="150" height="7" rx="3.5" fill="#CAD4DC"/>
  <rect x="936" y="222" width="120" height="7" rx="3.5" fill="#CAD4DC"/>
  <rect x="936" y="262" width="74" height="34" rx="6" fill="#0F4C6E"/>
  <text x="973" y="284" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Aceptar</text>
  <rect x="1018" y="262" width="74" height="34" rx="6" fill="#FFFFFF" stroke="#0F4C6E" stroke-width="2"/>
  <text x="1055" y="284" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0F4C6E">Modificar</text>

  <!-- Base de la pantalla -->
  <rect x="895" y="332" width="40" height="22" fill="#9AA9B5"/>
  <rect x="860" y="352" width="110" height="10" rx="5" fill="#7D8C98"/>
  </g>
</svg>
